
name: Build Sudut Pandang Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3

      - name: Ekstrak proyek
        run: |
          unzip -o SudutPandangStudioV1_Prototipe.zip -d .

      - name: Bangun APK
        run: gradle --no-daemon assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudut-Pandang-Studio-APK
          path: app/build/outputs/apk/debug/*.apk
