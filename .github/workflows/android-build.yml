
name: Build Sudut Pandang Studio APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode sumber
        uses: actions/checkout@v6

      - name: Siapkan Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Pasang Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ekstrak proyek
        run: unzip -o SudutPandangStudioV1_Prototipe.zip -d .

      - name: Periksa file proyek
        run: |
          ls -la
          ls -la app

      - name: Bangun APK
        run: gradle --no-daemon assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Sudut-Pandang-Studio-APK
          path: app/build/outputs/apk/debug/*.apk
          
